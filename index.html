<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peladas do G8 - Acesso</title>
    <!-- CSS Externo -->
    <link rel="stylesheet" href="src/css/styles.css">
    <script src="src/javascript/supabase-lib.js"></script>
    <script src="src/javascript/script.js"></script>
    
</head>
<body>

    <div class="logo">⚽ Peladas do G8</div>

    <div id="login-container">
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="password" placeholder="Senha" required>
        
        <!-- Chamamos a função com window. para garantir que o navegador a encontre -->
        <button class="btn-entrar" onclick="handleLogin()">
            ENTRAR NO SISTEMA
        </button>
        <button id="btn-admin" class="btn-entrar"  onclick="handleLogin()"">
            PAINEL DO ADMINISTRADOR
        </button>
        <div id="message" style="margin-top: 10px; color: #ff4d4d; font-size: 14px;"></div>
    </div>

    <button class="btn-sair" onclick="sairDaTela()">SAIR</button>

</body>
</html>
