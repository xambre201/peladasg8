telabase<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peladas do G8 - Acesso</title>
    <!-- CSS Externo -->
    <link rel="stylesheet" href="src/css/styles.css">
    <script src="src/javascript/supabase-lib.js"></script>
    
</head>
<body>

    <div class="logo">⚽ Peladas do G8</div>

    <div id="login-container">
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="password" placeholder="Senha" required>
        
        <!-- Chamamos a função com window. para garantir que o navegador a encontre -->
        <button class="btn-entrar" onclick="handleLogin()">
            ENTRAR NO SISTEMA
        </button>
        <div id="message" style="margin-top: 10px; color: #ff4d4d; font-size: 14px;"></div>
    </div>

    <button class="btn-sair" onclick="sairDaTela()">SAIR</button>


<script>
    var supabaseClient;

    window.onload = function() {
        // Suas chaves (URL e KEY)
       const URL = 'https://ruyvfilupwwocqbnknws.supabase.co/rest/v1/'; // Verifique se a sua URL está completa
       const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1eXZmaWx1cHd3b2NxYm5rbndzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNzcxMzEsImV4cCI6MjA5MDc1MzEzMX0.vb9aa_dXhqXWKm5GBlvYFSAHxmUkrUG-zZYxrbR1has'; 

        // Agora a biblioteca SEMPRE estará disponível pois é local
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(URL, KEY);
            console.log("✅ Supabase carregado localmente com sucesso!");
        } else {
            console.error("Erro ao ler o arquivo local src/javascript/supabase-lib.js");
        }
    };

    async function handleLogin() {
        if (!supabaseClient) return;

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            document.getElementById('message').textContent = "Erro: " + error.message;
        } else {
            abrirJanelaSistema();
        }
    }

    function abrirJanelaSistema() {
        const largura = 390;
        const altura = 844;
        window.open('telabase.html', 'PeladasG8', `width=${largura},height=${altura}`);
    }

    function sairDaTela() {
        window.close();
        setTimeout(() => {
            window.location.href = "https://google.com";
        }, 500);
    }
    
</script>

</body>
</html>
