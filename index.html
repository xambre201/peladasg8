<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peladas do G8 - Acesso</title>
    <!-- CSS Externo -->
    <link rel="stylesheet" href="src/css/styles.css">

<!-- 1. Carrega a biblioteca global primeiro -->
<!-- 1. Carrega a biblioteca global -->



    
</head>
<body>

    <div class="logo">⚽ Peladas do G8</div>

    <div id="login-container">
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="password" placeholder="Senha" required>
        
        <!-- Chamamos a função com window. para garantir que o navegador a encontre -->
        <button class="btn-entrar" onclick="handleLogin()">
            ENTRAR NO SISTEMA
        </button>
        <div id="message" style="margin-top: 10px; color: #ff4d4d; font-size: 14px;"></div>
    </div>

    <button class="btn-sair" onclick="sairDaTela()">SAIR</button>

    
<script src="https://unpkg.com"></script>

<script>
    var supabaseClient;

    // Função para configurar o Supabase
    function configurarSupabase() {
      
      const SUPABASE_URL = 'https://ruyvfilupwwocqbnknws.supabase.co/rest/v1/'; // Verifique se a sua URL está completa
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1eXZmaWx1cHd3b2NxYm5rbndzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNzcxMzEsImV4cCI6MjA5MDc1MzEzMX0.vb9aa_dXhqXWKm5GBlvYFSAHxmUkrUG-zZYxrbR1has'; 


        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log("Supabase inicializado!");
        } else {
            console.log("Aguardando biblioteca...");
            setTimeout(configurarSupabase, 500); // Tenta de novo em meio segundo
        }
    }

    // Inicia a tentativa de configuração
    configurarSupabase();

    async function handleLogin() {
        if (!supabaseClient) {
            alert("A conexão com o banco de dados ainda não está pronta. Aguarde um instante.");
            return;
        }

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            messageDiv.textContent = "Erro: " + error.message;
        } else {
            messageDiv.style.color = "#28a745";
            messageDiv.textContent = "Sucesso! Abrindo...";
            abrirJanelaSistema();
        }
    }

    function abrirJanelaSistema() {
        const largura = 390;
        const altura = 844;
        const topo = (screen.height / 2) - (altura / 2);
        const esquerda = (screen.width / 2) - (largura / 2);

        window.open(
            'https://github.io', 
            'PeladasG8', 
            `width=${largura},height=${altura},top=${topo},left=${esquerda},scrollbars=yes,resizable=no`
        );
    }

    function sairDaTela() {
        window.close();
        setTimeout(() => {
            window.location.href = "https://google.com";
        }, 500);
    }
    
</script>

</body>
</html>
