<!DOCTYPE html>
<html lang="pt-br"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/styles.css">
    <script src="src/javascript/script.js" defer></script>
    <script src="https://jsdelivr.net"></script>
    <title>Peladas do G8 - Acesso</title>
    <style>
     
    </style>
</head>
<body>

    <div class="logo">⚽ Peladas do G8</div>

    <!-- Este botão vai disparar o tamanho mobile -->
   <div id="login-container">
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="password" placeholder="Senha" required>
    
    <button class="btn-entrar" onclick="handleLogin()">
        ENTRAR NO SISTEMA
    </button>
    <div id="message" style="margin-top: 10px; color: #ff4d4d; font-size: 14px;"></div>
  </div>

    <p>Otimizado para visualização mobile</p>

    <script>
        function iniciarApp() {
            // Definições de tamanho mobile (iPhone 12/13)
            const largura = 390;
            const altura = 844;
            
            // Centralizar a janelinha no monitor do PC
            const topo = (window.screen.height / 2) - (altura / 2);
            const esquerda = (window.screen.width / 2) - (largura / 2);

            // Abre o seu arquivo do sistema (AJUSTE O NOME DO ARQUIVO ABAIXO)
            window.open(
                'https://html-preview.github.io/?url=https://raw.githubusercontent.com/xambre201/peladasg8/main/index.html#', // <--- Coloque aqui o nome do seu arquivo atual
                'PeladasG8', 
                `width=${largura},height=${altura},top=${topo},left=${esquerda},scrollbars=yes,resizable=no`
            );
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
        
            // 1. Tenta fazer o login
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });
        
            if (error) {
                // Exibe erro se a senha ou e-mail estiverem incorretos
                messageDiv.textContent = `Erro: ${error.message}`;
            } else {
                messageDiv.style.color = "#28a745";
                messageDiv.textContent = 'Login realizado! Abrindo...';
                
                // 2. Se o login for sucesso, abre o sistema mobile
                abrirJanelaSistema();
            }
        }
        
        function abrirJanelaSistema() {
            const largura = 390;
            const altura = 844;
            const topo = (window.screen.height / 2) - (altura / 2);
            const esquerda = (window.screen.width / 2) - (largura / 2);
        
            // Abre o seu arquivo do sistema (AJUSTE O NOME DO ARQUIVO ABAIXO)
            window.open(
                'https://html-preview.github.io/?url=https://raw.githubusercontent.com/xambre201/peladasg8/main/index.html#', // <--- Coloque aqui o nome do seu arquivo atual
                'PeladasG8', 
                `width=${largura},height=${altura},top=${topo},left=${esquerda},scrollbars=yes,resizable=no`
            );
        }

        
    </script>
    <!-- Botão de Sair abaixo do botão de Entrar -->
<button class="btn-sair" onclick="sairDaTela()">
    SAIR
</button>

<style>
    .btn-sair {
        margin-top: 10px;
        padding: 10px 20px;
        background: transparent;
        color: #888;
        border: 1px solid #444;
        border-radius: 50px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
    }

    .btn-sair:hover {
        color: #ff4d4d;
        border-color: #ff4d4d;
    }
</style>

<script>
    function sairDaTela() {
        // Tenta fechar, se não conseguir, redireciona
        window.close();
        setTimeout(() => {
            window.location.href = "https://google.com";
        }, 500);
    }
</script>

    
</body>
</html>
