<!DOCTYPE html>
<html lang="pt-br"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/styles.css">
    <script src="src/javascript/script.js" defer></script>
    <script src="https://jsdelivr.net"></script>
    <title>Peladas do G8 - Acesso</title>
    <style>
     
    </style>
</head>
<body>

    <div class="logo">⚽ Peladas do G8</div>

    <!-- Este botão vai disparar o tamanho mobile -->
   <div id="login-container">
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="password" placeholder="Senha" required>
    
    <button class="btn-entrar" onclick="handleLogin()">
        ENTRAR NO SISTEMA
    </button>
    <div id="message" style="margin-top: 10px; color: #ff4d4d; font-size: 14px;"></div>
  </div>

    <p>Otimizado para visualização mobile</p>

    <!-- Botão de Sair abaixo do botão de Entrar -->
<button class="btn-sair" onclick="sairDaTela()">
    SAIR
</button>

<style>
    .btn-sair {
        margin-top: 10px;
        padding: 10px 20px;
        background: transparent;
        color: #888;
        border: 1px solid #444;
        border-radius: 50px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
    }

    .btn-sair:hover {
        color: #ff4d4d;
        border-color: #ff4d4d;
    }
</style>

<script>
    function sairDaTela() {
        // Tenta fechar, se não conseguir, redireciona
        window.close();
        setTimeout(() => {
            window.location.href = "https://google.com";
        }, 500);
    }
</script>

    
</body>
</html>
